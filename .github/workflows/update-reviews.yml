name: Update Google Reviews

on:
  schedule:
    # Runs once a day at 02:25 AM Toronto TimeZone. Adjust as needed.
    - cron: '25 2 * * *'
      timezone: 'America/Toronto'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Show schedule timezone
        run: |
          echo "UTC $(date -u)"
          echo "Runner local: $(date)"
        
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest Google reviews
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
        run: node scripts/fetch-google-reviews.mjs

      - name: Commit updated reviews.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reviews.json

          if git diff --cached --quiet; then
            echo "No changes to reviews.json"
            exit 0
          fi
          git commit -m "chore: update Google reviews"
          git push
